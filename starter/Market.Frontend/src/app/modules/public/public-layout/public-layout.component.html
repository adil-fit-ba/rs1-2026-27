<div class="public-shell">
  <!-- Header -->
  <header class="public-header">
    <a routerLink="/" class="brand">
      <mat-icon>storefront</mat-icon>
      <span>FIT Market</span>
    </a>

    <nav class="public-nav">
      <a mat-button routerLink="/search" routerLinkActive="active">
        <mat-icon>search</mat-icon>
        {{ 'PUBLIC.NAV.SEARCH_PRODUCTS' | translate }}
      </a>

      @if (currentUser.isAuthenticated()) {
        <a mat-flat-button [routerLink]="currentUser.getDefaultRoute()">
          <mat-icon>account_circle</mat-icon>
          {{ 'PUBLIC.NAV.MY_ACCOUNT' | translate }}
        </a>
      } @else {
        <a mat-flat-button routerLink="/auth/login">
          <mat-icon>login</mat-icon>
          {{ 'PUBLIC.NAV.LOGIN' | translate }}
        </a>
      }
    </nav>
  </header>

  <!-- Stranica (landing, pretraga proizvoda, ...) -->
  <main class="public-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="public-footer">© {{ currentYear }} FIT Market</footer>
</div>
